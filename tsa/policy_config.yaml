meta:
  policy_id: "tsa-fusion-v1"
  version: "3.3.0"

storage:
  state_db: "state/tsa.db"
  report_path: "reports/last_scan.json"

scoring:
  # Initial defaults only. Persisted API settings take precedence immediately.
  weights_db: "settings/weights.db"
  weights:
    posture: 0.4
    runtime: 0.6

reporting:
  interval_seconds: 300
  retention_days: 30

maintenance:
  file: "/run/tsa-fusion/maintenance"

# --- 1. 静态姿态检查 (Posture: 基线与配置) ---

baseline_lynis:
  enabled: true

  # Root-owned tsa-baseline.timer runs Lynis; unprivileged TSA only reads.
  run_lynis: false
  lynis_cmd: "lynis audit system --quick --quiet"
  report_path: "/var/lib/tsa-baseline/lynis-report.dat"
  interval_seconds: 30
  max_report_age_seconds: 86400

  # Project risk weights, not Lynis hardening points or a compliance score.
  # All findings remain visible. Each control contributes its maximum once.
  policy_version: "ubuntu-host-v3"
  require_execution_metadata: true
  required_controls: [AUTH-9204, AUTH-9283, PKGS-7392]
  controls:
    AUTH-9204:
      title: "额外的 UID 0 账号"
      warning: 25
      reason: "非 root 账号具有最高权限，需核实并限制"
    AUTH-9283:
      title: "无密码账号"
      warning: 25
      reason: "发现未设置密码的账号；实际可登录性仍取决于认证配置"
    AUTH-9216:
      title: "组与影子组文件一致性"
      warning: 10
      reason: "grpck 报告账号组数据异常，需人工检查具体错误"
    PKGS-7392:
      title: "待安装的安全更新"
      warning: 15
      reason: "发现待安装安全更新，按补丁管理缺口固定扣 15 分；不按软件包数量累加，不代表已确认可利用的 CVE"
    SSH-7408:
      title: "SSH 安全配置"
      reason: "只按 details 中明确的危险值计分；同项取最高值，端口 22 等建议不扣分"
      detail_matches:
        - {field: PermitRootLogin, values: ["YES"], points: 15, reason: "未在该选项限制 root 登录方式，需结合其他认证设置复核"}
        - {field: StrictModes, values: ["NO"], points: 15, reason: "关闭 SSH 用户文件权限检查"}
        - {field: IgnoreRhosts, values: ["NO"], points: 0, reason: "仅在主机认证启用时影响用户信任文件；报告缺少 HostbasedAuthentication 上下文，保留提示供复核，不自动扣分"}
        - {field: PermitUserEnvironment, values: ["YES"], points: 5, reason: "允许用户注入 SSH 会话环境，需核对受限会话策略"}
    AUTH-9262:
      title: "PAM 密码强度模块"
      suggestion: 5
      reason: "未发现本机密码强度模块，记低权重加固缺口；不等于用户密码已被破解，外部统一认证主机可调整为 0"
    AUTH-9328:
      title: "默认 umask"
      reason: "新文件默认权限需结合用户协作需求审查，默认仅提示"
    KRNL-5820:
      title: "Core dump 配置"
      reason: "调试与敏感内存泄露风险需结合转储权限判断，默认仅提示"
    LOGG-2190:
      title: "已删除但仍被进程打开的文件"
      reason: "升级、日志轮转也会出现，不能直接判为入侵，默认仅提示"
    FIRE-4513:
      title: "未命中的 iptables 规则"
      reason: "零命中不等于防火墙失效，不自动扣分，也不建议直接删规则"
    BOOT-5122:
      title: "引导加载器密码"
      reason: "取决于物理访问和虚拟化管理边界，默认仅提示"
    NETW-3200:
      title: "网络协议加固建议"
      reason: "协议是否需要取决于业务用途；建议禁用不等于已发现可利用漏洞，默认仅提示"

# --- 2. 动态运行时监控 (Runtime: Falco) ---

runtime_rules:
  enabled: true
  # Narrow exemptions belong in Falco rules; broad process-name exemptions can
  # hide malicious programs that rename themselves to a trusted process name.
  whitelist: {proc_names: [], users: [], paths_prefix: []}
  log_path: "/var/log/falco/falco.json"
  start_at_end: true
  poll_interval: 1
  
  # Peak risk per rule: repeated alerts renew evidence, never multiply the penalty.
  aggregation: peak_per_rule
  unmapped_rule_action: record_only
  event_time_scoring: true
  signal_budget:
    max_points: 15
    reason: "名称、环境变量和启动参数属于弱线索，合计最多 15 分；不限制其他敏感行为规则"
    rules:
      - "Known Cryptominer Process Executed"
      - "Remove Bulk Data from Disk"
      - "Polkit Local Privilege Escalation Vulnerability (CVE-2021-4034)"
      - "Potential Local Privilege Escalation via Environment Variables Misuse"
      - "Detect crypto miners using the Stratum protocol"
  # Exact, successful, read-only host/root contexts. Never exempt by process name alone.
  context_advisories:
    - rule: "Directory traversal monitored file read"
      reason: "符合 VMware 挂起/恢复脚本读取自身配置的上下文，保留告警供复核，不扣分；不证明程序未被利用"
      match:
        uid: [0]
        container_id: [host]
        executable: [/usr/bin/dash]
        parent: [resume-vm-defau, suspend-vm-defa]
        command:
          - "network -x /etc/vmware-tools/scripts/vmware/network resume-vm"
          - "network -x /etc/vmware-tools/scripts/vmware/network suspend-vm"
        file: [/etc/vmware-tools/statechange.subr]
    - rule: "Read sensitive file untrusted"
      reason: "符合系统 VMware Tools 的认证读取上下文，保留告警供复核，不扣分"
      match:
        uid: [0]
        container_id: [host]
        executable: [/usr/bin/vmtoolsd]
        parent: [systemd]
        command: [vmtoolsd]
        file: [/etc/pam.d/vmtoolsd, /etc/pam.d/common-auth, /etc/pam.d/common-account, /etc/pam.d/common-password, /etc/pam.d/common-session, /etc/pam.d/other, /etc/shadow]
    - rule: "Read sensitive file untrusted"
      reason: "符合 GDM 登录会话的认证读取上下文，保留告警供复核，不扣分"
      match:
        uid: [0]
        container_id: [host]
        executable: [/usr/libexec/gdm-session-worker]
        parent: [gdm-session-wor]
        command: [gdm-session-wor]
        file: [/etc/pam.d/gdm-password, /etc/pam.d/common-auth, /etc/pam.d/common-account, /etc/pam.d/common-password, /etc/pam.d/common-session, /etc/pam.d/other, /etc/shadow]
    - rule: "Read sensitive file untrusted"
      reason: "符合 Ubuntu 更新通知程序的固定权限检查上下文，保留告警供复核，不扣分"
      match:
        uid: [0]
        container_id: [host]
        executable: [/usr/bin/pkexec]
        parent: [update-notifier]
        command: ["pkexec /usr/lib/update-notifier/package-system-locked"]
        file: [/etc/pam.d/polkit-1, /etc/pam.d/common-auth, /etc/pam.d/common-account, /etc/pam.d/common-password, /etc/pam.d/common-session, /etc/pam.d/common-session-noninteractive, /etc/pam.d/other]
  event_control:
    dedup_window: 60
    max_points_per_minute: 0
    max_active_points_per_rule: 20
    risk_ttl_seconds: 3600

  # Explicit, reviewable weights; priority/tags do not determine these scores.
  specific_rules:
    "Directory traversal monitored file read":
      points: 10
      risk_ttl_seconds: 14400
      reason: "路径穿越式敏感文件访问"
    "Read sensitive file untrusted":
      points: 5
      risk_ttl_seconds: 3600
      reason: "非预期敏感文件读取，需排查合法登录和虚拟机组件"
    "Search Private Keys or Passwords":
      points: 10
      risk_ttl_seconds: 14400
      reason: "搜索密钥或口令线索"
    "Clear Log Activities":
      points: 10
      risk_ttl_seconds: 14400
      reason: "日志清理，需核对维护任务"
    "Create Symlink Over Sensitive Files":
      points: 5
      risk_ttl_seconds: 3600
      reason: "敏感路径软链接变更"
    "Create Hardlink Over Sensitive Files":
      points: 5
      risk_ttl_seconds: 3600
      reason: "敏感路径硬链接变更"
    "Linux Kernel Module Injection Detected":
      points: 10
      risk_ttl_seconds: 14400
      reason: "具有 SYS_MODULE 能力的容器加载内核模块，需核对授权维护；不是任意主机驱动安装"
    "PTRACE attached to process":
      points: 5
      risk_ttl_seconds: 3600
      reason: "进程附加调试，可能为合法调试"
    "Execution from /dev/shm":
      points: 10
      risk_ttl_seconds: 14400
      reason: "共享内存目录执行"
    "Fileless execution via memfd_create":
      points: 15
      risk_ttl_seconds: 14400
      reason: "内存文件执行，仍需核对合法运行时"
    "Update Package Repository":
      points: 5
      risk_ttl_seconds: 3600
      reason: "软件源变更，需核对批准记录"
    "Write below binary dir":
      points: 10
      risk_ttl_seconds: 14400
      reason: "系统程序写打开"
    "Write below monitored dir":
      points: 10
      risk_ttl_seconds: 14400
      reason: "启动、库和关键目录写打开"
    "Modify binary dirs":
      points: 10
      risk_ttl_seconds: 14400
      reason: "系统程序删除或重命名"
    "Detect crypto miners using the Stratum protocol":
      points: 10
      risk_ttl_seconds: 14400
      reason: "命令行包含 Stratum 地址特征，比单纯进程名更具体；未验证网络连接或实际挖矿，记 10 分"
    "Netcat/Socat Remote Code Execution on Host":
      points: 15
      risk_ttl_seconds: 14400
      reason: "网络工具执行命令特征"
    "Known Cryptominer Process Executed":
      points: 5
      risk_ttl_seconds: 14400
      reason: "仅进程名匹配矿工名单，未验证文件身份或挖矿行为；作为待核实线索记 5 分"
    "Modify Shell Configuration File":
      points: 5
      risk_ttl_seconds: 3600
      reason: "Shell 启动配置变更"
    "Set Setuid or Setgid bit":
      points: 10
      risk_ttl_seconds: 14400
      reason: "SUID 或 SGID 权限变更"
    "Adding ssh keys to authorized_keys":
      points: 10
      risk_ttl_seconds: 14400
      reason: "SSH 持久访问凭据变更"
    "Run shell untrusted":
      points: 10
      risk_ttl_seconds: 14400
      reason: "非预期进程启动 Shell"
    "Remove Bulk Data from Disk":
      points: 5
      risk_ttl_seconds: 14400
      reason: "仅发现 shred、mkfs 或 mke2fs 启动，未确认执行参数或数据删除；作为待核实线索记 5 分"
    "Web Server Spawned Shell":
      points: 15
      risk_ttl_seconds: 14400
      reason: "Web 进程链启动 Shell"
    "Web Server Spawned Suspicious Child Process":
      points: 10
      risk_ttl_seconds: 14400
      reason: "Web 进程链启动可疑工具"
    "Reverse Shell from Web Server":
      points: 20
      risk_ttl_seconds: 86400
      reason: "Web 进程链反向 Shell 字符串特征"
    "Sudo Potential Privilege Escalation":
      points: 15
      risk_ttl_seconds: 14400
      reason: "sudo 可疑参数，不确认漏洞利用成功"
    "Polkit Local Privilege Escalation Vulnerability (CVE-2021-4034)":
      points: 5
      risk_ttl_seconds: 14400
      reason: "非 root 登录会话启动无参数 pkexec，未确认恶意载荷、补丁状态或提权成功；作为待核实线索记 5 分"
    "Potential Local Privilege Escalation via Environment Variables Misuse":
      points: 5
      risk_ttl_seconds: 14400
      reason: "执行环境包含 GLIBC_TUNABLES 字样，合法调优也会触发；未验证变量值或 glibc 漏洞，记 5 分"
    "Delete or rename shell history":
      points: 5
      risk_ttl_seconds: 3600
      reason: "历史记录删除或重命名"
    "Monitor specific file access":
      points: 10
      risk_ttl_seconds: 900
      reason: "演示文件访问，按配置实际计 10 分；用于可视化验收，不表示确认攻击"
